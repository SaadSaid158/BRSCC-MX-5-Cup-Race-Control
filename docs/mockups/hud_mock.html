<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{--y:#ffd400;--g:#19b44a;--k:#000;--w:#fff;--p:#7b2fbe;--panel:rgba(8,10,14,.78);--dim:#9aa3ad}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;font-family:"Segoe UI",Arial,sans-serif;color:#fff;
 background:linear-gradient(180deg,#5d7a96 0%,#9fb3c4 38%,#4c5a48 39%,#3f4a3b 55%,#2c2f33 56%,#23262a 100%);position:relative;overflow:hidden}
.road{position:absolute;left:560px;right:560px;top:600px;bottom:0;background:linear-gradient(90deg,#d22 0 2%,#fff 2% 4%,#2b2d31 4% 96%,#fff 96% 98%,#d22 98%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
.dash{position:absolute;left:0;right:0;bottom:0;height:260px;background:#0b0c0e;border-top-left-radius:50% 60px;border-top-right-radius:50% 60px}
.label{position:absolute;left:24px;top:20px;font-size:22px;font-weight:700;background:#000a;padding:6px 14px;border-radius:6px}
/* flag panel */
.flag{position:absolute;top:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;
 background:var(--panel);padding:12px 22px 12px 12px;border-radius:12px;border:2px solid #fff2}
.lamp{width:150px;height:96px;border-radius:8px}
.lamps{display:flex;gap:8px}
.ftxt .big{font-size:40px;font-weight:800;letter-spacing:1px;line-height:1}
.ftxt .small{font-size:20px;color:#e8e8e8;margin-top:6px}
.post{font-size:16px;color:var(--dim);margin-top:4px}
/* track strip */
.strip{position:absolute;top:150px;left:50%;transform:translateX(-50%);width:760px;background:var(--panel);border-radius:10px;padding:10px 14px}
.bar{position:relative;height:22px;display:flex;gap:3px}
.seg{flex:1;border-radius:3px;background:#2e3a2f}
.seg.y{background:var(--y)}.seg.yy{background:repeating-linear-gradient(90deg,var(--y) 0 10px,#c9a800 10px 20px)}.seg.g{background:var(--g)}
.me{position:absolute;top:-7px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #fff}
.car{position:absolute;top:26px;width:10px;height:10px;border-radius:50%;background:#cfd6dc}
.carx{background:#ff4a4a}
.striplbl{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);margin-top:16px}
/* race panel */
.race{position:absolute;left:36px;bottom:300px;width:340px;background:var(--panel);border-radius:12px;padding:14px 18px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.pos{font-size:64px;font-weight:800;line-height:1}.pos small{font-size:26px;color:var(--dim);font-weight:600}
.lap{font-size:28px;font-weight:700;text-align:right}.lap small{display:block;font-size:15px;color:var(--dim);font-weight:500}
.gaps{margin-top:10px;font-size:22px}.gaps div{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid #ffffff14}
.gaps b{font-variant-numeric:tabular-nums}.gaps .n{color:var(--dim)}
.up{color:#47d16f}.dn{color:#ff6b6b}
/* penalty panel */
.pen{position:absolute;right:36px;bottom:300px;width:360px;background:var(--panel);border-radius:12px;padding:14px 18px}
.pen h4{font-size:15px;color:var(--dim);letter-spacing:2px;margin-bottom:8px}
.pips{display:flex;gap:6px;margin:6px 0 10px}.pip{flex:1;height:14px;border-radius:3px;background:#ffffff22}
.pip.on{background:#ffb020}.pip.hot{background:#ff4a4a}
.chip{display:inline-block;font-size:20px;font-weight:700;padding:6px 12px;border-radius:7px;margin:4px 6px 0 0}
.c-time{background:#ffb020;color:#000}.c-dt{background:#000;border:2px solid #fff}.c-ok{background:#ffffff1c;color:#ddd}
/* ticker */
.tick{position:absolute;top:226px;left:50%;transform:translateX(-50%);background:#000c;border-left:6px solid var(--y);
 padding:10px 18px;font-size:22px;border-radius:6px;white-space:nowrap}
.tick b{color:var(--y)}
.sc{background:var(--y);color:#000;font-size:54px;font-weight:900;width:150px;height:96px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:4px solid #000}
.bw{background:linear-gradient(135deg,#000 50%,#fff 50%)}
</style></head><body>
<div class="road"></div><div class="dash"></div>
<div class="label" id="lbl"></div>
<div id="hud"></div>
<script>
const S = new URLSearchParams(location.search).get('s')||'yy';
const segs = (arr)=>arr.map(c=>`<div class="seg ${c}"></div>`).join('');
const hud = document.getElementById('hud');
let flag, strip, tick, pen, lbl;
if (S==='yy'){
  lbl='A) Double yellow ahead + track limits warning';
  flag=`<div class="lamps"><div class="lamp" style="background:var(--y)"></div><div class="lamp" style="background:var(--y)"></div></div>
   <div class="ftxt"><div class="big">DOUBLE YELLOW</div><div class="small">Slow · be ready to stop · NO OVERTAKING</div><div class="post">Post 6 · Brooklands · 240 m ahead</div></div>`;
  strip=segs(['','','','','','','y','yy','g','','','']);
  tick=`<b>RACE CONTROL</b> &nbsp;Car 27 stopped on track at Brooklands`;
  pen=`<h4>TRACK LIMITS</h4><div class="pips"><div class="pip on"></div><div class="pip on"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
   <div style="font-size:17px;color:#ffb020">2 of 6 · next: +5 s</div>
   <h4 style="margin-top:12px">PENALTIES</h4><span class="chip c-ok">None</span>`;
} else if (S==='sc'){
  lbl='B) Safety Car';
  flag=`<div class="lamps"><div class="sc">SC</div><div class="lamp" style="background:var(--y)"></div></div>
   <div class="ftxt"><div class="big">SAFETY CAR</div><div class="small">Close up · max 5 car lengths · NO OVERTAKING</div><div class="post">SC lights ON · pit lane open</div></div>`;
  strip=segs(['y','y','y','y','y','y','y','y','y','y','y','y']);
  tick=`<b>RACE CONTROL</b> &nbsp;Safety Car deployed · lapped cars will NOT be waved past`;
  pen=`<h4>TRACK LIMITS</h4><div class="pips"><div class="pip on"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
   <div style="font-size:17px;color:var(--dim)">1 of 6 · noted</div>
   <h4 style="margin-top:12px">PENALTIES</h4><span class="chip c-time">+5 s</span>`;
} else {
  lbl='C) Drive-through penalty (5th track-limits breach)';
  flag=`<div class="lamps"><div class="lamp" style="background:#000;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900">42</div></div>
   <div class="ftxt"><div class="big">DRIVE-THROUGH</div><div class="small">Enter pit lane within 3 laps · 60 km/h</div><div class="post">NCR Ch.12 App.10 · 2 laps left</div></div>`;
  strip=segs(['','','','','','','','','','','','']);
  tick=`<b>RACE CONTROL</b> &nbsp;#42 Drive-through penalty – track limits #5 – serve within 3 laps`;
  pen=`<h4>TRACK LIMITS</h4><div class="pips"><div class="pip on"></div><div class="pip on"></div><div class="pip on"></div><div class="pip on"></div><div class="pip hot"></div><div class="pip"></div></div>
   <div style="font-size:17px;color:#ff6b6b">5 of 6 · next: BLACK FLAG</div>
   <h4 style="margin-top:12px">PENALTIES</h4><span class="chip c-time">+15 s</span><span class="chip c-dt">DRIVE-THROUGH · 2 laps left</span>`;
}
document.getElementById('lbl').textContent=lbl;
hud.innerHTML = `
<div class="flag">${flag}</div>
<div class="strip"><div class="bar">${strip}
  <div class="me" style="left:41%"></div>
  <div class="car" style="left:44%"></div><div class="car carx" style="left:61%"></div><div class="car" style="left:70%"></div><div class="car" style="left:23%"></div>
 </div><div class="striplbl"><span>S/F</span><span>marshal posts · ▼ you · ● cars · red = stopped</span><span>S/F</span></div></div>
<div class="tick">${tick}</div>
<div class="race"><div class="row"><div class="pos">P4<small>/10</small></div><div class="lap">LAP 6 / 15<small>Race 2 · 9 laps to go</small></div></div>
 <div class="gaps"><div><span class="n">Ahead · Car 27</span><b class="up">-0.84</b></div><div><span class="n">Behind · Car 8</span><b class="dn">+0.41</b></div>
 <div><span class="n">Last</span><b>1:26.412</b></div><div><span class="n">Best</span><b>1:25.903</b></div></div></div>
<div class="pen">${pen}</div>`;
</script></body></html>
