name: tests
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Unit tests
        run: luajit tests/run.lua
      - name: Simulated race
        run: luajit tests/sim.lua
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: install-zip
          path: dist/*.zip

  release:
    # Push a tag like v0.1.3 -> tests run, then the install zip is published as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: scripts/package.sh
      - name: Check tag matches manifest version
        run: |
          V=$(sed -n 's/^VERSION *= *//p' src/brscc_race_control/manifest.ini | tr -d '\r')
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != manifest v$V"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" \
            --notes "Install: unzip into your Assetto Corsa root folder (the one with acs.exe). Test plan: docs/" \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
