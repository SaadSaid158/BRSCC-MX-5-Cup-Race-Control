[ABOUT]
NAME = BRSCC Race Control
AUTHOR = BRSCC Race Control project
VERSION = 0.2.1
DESCRIPTION = Offline race control for the BRSCC Mazda MX-5 Championship: marshal posts, flags, stewards, penalties and AI compliance per the 2026 regulations and the Motorsport UK NCR.

ICON = icons/racecontrol.png

[CORE]
LAZY = NONE

